<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Review Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a review bench. Work area on the left (pair + decision), ledger on the far right (tally, state list, report). */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E7EAF0; --ink:#141925; --muted:#586174; --line:#D3D8E2;
  --accent:#3148C8; --on-accent:#FFFFFF;
  --ok:#1E7F4F; --ok-bg:#E2F3E9; --no:#B8322A; --no-bg:#FBE6E3; --warn:#8A5800; --warn-bg:#FCEFD2;
  --ok-solid:#1E7F4F; --no-solid:#B8322A; --on-solid:#FFFFFF;
  --display:"Schibsted Grotesk","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131A; --surface:#181C26; --surface-2:#232938; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2F3647;
    --accent:#93A3FF; --on-accent:#10131A;
    --ok:#62CF95; --ok-bg:#163828; --no:#FF8F84; --no-bg:#43201D; --warn:#F0BC5E; --warn-bg:#3B2F14;
    --ok-solid:#2A915D; --no-solid:#CC463B; --on-solid:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#181C26; --surface-2:#232938; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2F3647;
  --accent:#93A3FF; --on-accent:#10131A;
  --ok:#62CF95; --ok-bg:#163828; --no:#FF8F84; --no-bg:#43201D; --warn:#F0BC5E; --warn-bg:#3B2F14;
  --ok-solid:#2A915D; --no-solid:#CC463B; --on-solid:#FFFFFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,.drop:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
kbd{font:500 11px/1 var(--mono);border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.75}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .name{font:700 17px/1.2 var(--display)}
.top .meta{color:var(--muted);font-size:13px;flex:1 1 320px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.ghost:hover{border-color:var(--muted)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px;max-width:1360px;margin:0 auto}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr);padding:16px}}

.crumbs{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.crumbs .over{color:var(--muted);font-size:13px}
.crumbs h1{font-size:26px;line-height:1.15}
.pos{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pos button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.pos button:hover{border-color:var(--muted)}

.qa{border-radius:10px;padding:10px 14px;border-left:4px solid var(--ok);background:var(--ok-bg);font-size:14px}
.qa.blocked{border-left-color:var(--warn);background:var(--warn-bg)}
.qa strong{font-weight:600}
.qa ul{margin:4px 0 0;padding-left:18px}

.pair{display:flex;justify-content:center;gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.pair figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pair figcaption{text-align:center}
.pair figcaption b{display:block;font:600 14px/1.3 var(--display);letter-spacing:.02em}
.pair figcaption span{color:var(--muted);font-size:12px}
.phone{height:clamp(340px,calc(100vh - 350px),640px);aspect-ratio:var(--ar,390/844);max-width:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 0 5px var(--surface-2);background:#fff}
.phone svg,.phone img{display:block;width:100%;height:100%;object-fit:contain}
.nodesign{height:100%;display:grid;place-items:center;text-align:center;padding:16px;color:#586174;font-size:14px;background:#F2F4F7}
.app.wide .pair{flex-direction:column;align-items:stretch}.app.wide .pair figure{align-items:stretch}.app.wide .phone,.app.wide .explain .phone{height:auto;width:100%;border-radius:10px}
@media (max-width:560px){.pair{gap:14px;padding:12px}.phone{height:auto;width:100%}}

.decide{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:12px 0;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;display:inline-flex;align-items:center;gap:10px}
.btn.ok{background:var(--ok-solid);color:var(--on-solid)}
.btn.no{background:var(--no-solid);color:var(--on-solid)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%;justify-content:center}
.btn[aria-pressed="false"]{opacity:.45}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:14px;letter-spacing:.02em;margin-bottom:10px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-bottom:12px}
.bar i{display:block}.bar .ok{background:var(--ok-solid)}.bar .no{background:var(--no-solid)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.tiles div{border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.tiles dt{font-size:12px;color:var(--muted)}
.tiles dd{margin:0;font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tiles .ok dd{color:var(--ok)}.tiles .no dd{color:var(--no)}
.tiles.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.tiles.four{grid-template-columns:1fr 1fr}}
.screens{margin:10px 0 0;font-size:13px;color:var(--muted)}

.states{flex:1 1 0;min-height:220px;contain:size;display:flex;flex-direction:column}
.list{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.gen{position:sticky;bottom:0;padding:12px 0;background:var(--bg);margin-top:-2px}
.app:not([data-view="review"]) aside{align-self:start;position:sticky;top:16px;height:calc(100vh - 32px)}
@media (max-width:920px){.states{flex:none;contain:none;min-height:0}.list{flex:none;max-height:340px}.app:not([data-view="review"]) aside{position:static;height:auto}}
.list h3{font:600 12px/1.3 var(--body);color:var(--muted);margin:8px 0 2px;padding:0 8px}
.list h3:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:14px}
.item:hover{background:var(--surface-2)}
.item.cur{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.item .nm{flex:1;min-width:0}
.mark{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--body);border:1.5px solid var(--muted);color:transparent}
.mark.ok{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--on-solid)}
.mark.no{background:var(--no-solid);border-color:var(--no-solid);color:var(--on-solid);border-radius:5px}
.flag{font:500 10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--warn-bg);color:var(--warn)}
.hint{margin:0;font-size:13px;color:var(--muted)}

.explain{display:grid;grid-template-columns:minmax(0,auto) minmax(280px,1fr);gap:20px;align-items:start}
.explain .pair{gap:14px;padding:14px}
.explain .phone{height:clamp(300px,calc(100vh - 330px),460px)}
@media (max-width:1100px){.explain{grid-template-columns:minmax(0,1fr)}}
.form{display:flex;flex-direction:column;gap:10px}
.form label.h,.form .h{font-weight:600;font-size:14px}
textarea{width:100%;min-height:120px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit}
.err{color:var(--no);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.drop label{color:var(--accent);text-decoration:underline;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .sp{flex:1}

.note{border-radius:10px;padding:10px 14px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);font-size:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:17px}
.dec{display:flex;flex-direction:column;gap:6px}
.dec h3{font-size:15px}
.dec .id{font:400 12px/1.4 var(--mono);color:var(--muted)}
.dec p{margin:0;max-width:65ch;white-space:pre-wrap}
.plain{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
pre{margin:0;padding:14px;border-radius:10px;background:var(--surface-2);font:400 13px/1.55 var(--mono);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow-y:auto}
.status{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,.btn,.chip{transition:background-color .12s,filter .12s}}
</style>
</head>
<body>
<header class="top">
  <span class="name">Design review</span>
  <span class="meta" id="meta"></span>
  <button class="ghost" id="clear" data-act="clear">Clear all decisions</button>
</header>
<div class="app">
  <main id="main"></main>
  <aside id="side"></aside>
</div>

<!-- Filled by scripts/build-review.py from review/round-<n>.json. Do not edit by hand. -->
<script type="application/json" id="run-data">__RUN_DATA__</script>

<script>
(function(){
"use strict";

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function picture(img,label){
  if(img&&img.src)return `<img src="${esc(img.src)}" alt="${esc(label)}">`;
  return `<div class="nodesign">No design drawn for this state</div>`;
}

/* ---------- run data and decisions ---------- */
const RUN=JSON.parse(document.getElementById("run-data").textContent);
const blocked=st=>st.qa&&st.qa.verdict==="blocked"?1:0;
RUN.screens.forEach(s=>s.states.sort((a,b)=>blocked(b)-blocked(a)));          // QA-flagged states first
RUN.screens.sort((a,b)=>Math.max(...b.states.map(blocked))-Math.max(...a.states.map(blocked)));
RUN.screens.forEach(s=>s.states.forEach(st=>{st.qa=st.qa||{verdict:"pass",notes:[]};st.qa.notes=st.qa.notes||[];}));
const ITEMS=RUN.screens.flatMap(s=>s.states.map(st=>Object.assign({},st,{screen:s.name,screenId:s.id,key:s.id+"--"+st.id})));
const TAGS=["Spacing","Colour","Typography","Content","Missing element","Layout","Behaviour"];
const KEY="design-review:"+RUN.id;

let D={};
try{D=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){D={};}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(D));}
  catch(e){try{const slim={};for(const k in D)slim[k]=Object.assign({},D[k],{images:[]});localStorage.setItem(KEY,JSON.stringify(slim));}catch(_){}}
}
const rec=k=>D[k]||(D[k]={status:null,reason:"",tags:[],images:[]});
const statusOf=k=>(D[k]&&D[k].status)||null;

let view="review",cur=Math.max(0,ITEMS.findIndex(i=>!statusOf(i.key))),exIdx=0,showErr=false,clearArmed=false,msg={};

function tally(){
  const t={total:ITEMS.length,ok:0,no:0,open:0,sTotal:RUN.screens.length,sOk:0,sNo:0,sOpen:0};
  ITEMS.forEach(i=>{const s=statusOf(i.key);s==="approved"?t.ok++:s==="declined"?t.no++:t.open++;});
  RUN.screens.forEach(s=>{const st=s.states.map(x=>statusOf(s.id+"--"+x.id));
    st.includes("declined")?t.sNo++:st.every(x=>x==="approved")?t.sOk++:t.sOpen++;});
  return t;
}
const declined=()=>ITEMS.filter(i=>statusOf(i.key)==="declined");
const qaLine=i=>i.qa.label||(i.qa.verdict==="blocked"?"Blocked after 3 fix rounds":"Passed");
const history=i=>(i.previous?`<div class="note">You declined this in round ${esc(i.previous.round)}: ${esc(i.previous.reason)}</div>`:"")+(i.changed?`<div class="note">This changed after you approved it, because a shared component was fixed. It needs a new decision.</div>`:"");

/* ---------- views ---------- */
function pairHTML(i){
  return `<div class="pair">
    <figure><figcaption><b>Design</b><span>${esc(RUN.design_caption||"Rendered at device size")}</span></figcaption><div class="phone">${picture(i.design,"Design: "+i.screen+", "+i.name)}</div></figure>
    <figure><figcaption><b>Implementation</b><span>${esc(RUN.capture_caption||"Device capture")}, build ${esc(RUN.build)}</span></figcaption><div class="phone">${picture(i.impl,"Implementation: "+i.screen+", "+i.name)}</div></figure>
  </div>`;
}
function reviewHTML(){
  const i=ITEMS[cur],s=statusOf(i.key);
  const notes=i.qa.notes.length?`<ul>${i.qa.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:"";
  return `<div class="crumbs"><div><div class="over">${esc(i.screen)}</div><h1>${esc(i.name)}</h1></div>
      <div class="pos"><button data-act="prev" aria-label="Previous state">←</button><span>${cur+1} of ${ITEMS.length}</span><button data-act="next" aria-label="Next state">→</button></div></div>
    <div class="qa ${i.qa.verdict==="blocked"?"blocked":""}"><strong>QA agent: ${esc(qaLine(i))}</strong>${notes}</div>
    ${history(i)}
    ${pairHTML(i)}
    <div class="decide">
      <button class="btn ok" data-act="approve" aria-pressed="${s?s==="approved":"mixed"}">Approve <kbd>A</kbd></button>
      <button class="btn no" data-act="decline" aria-pressed="${s?s==="declined":"mixed"}">Decline <kbd>D</kbd></button>
      ${s?`<button class="link" data-act="undo">Clear this decision</button>`:""}
    </div>`;
}
function explainHTML(){
  const list=declined(),i=list[exIdx],r=rec(i.key),last=exIdx===list.length-1;
  return `<div class="crumbs"><div><div class="over">Explain declines, ${exIdx+1} of ${list.length}</div><h1>${esc(i.screen)}: ${esc(i.name)}</h1></div>
      <button class="ghost" data-act="toReview">Back to review</button></div>
    <div class="explain">${pairHTML(i)}
      <div class="form">
        <div class="qa ${i.qa.verdict==="blocked"?"blocked":""}"><strong>QA agent: ${esc(qaLine(i))}</strong>${i.qa.notes.length?`<ul>${i.qa.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>
        ${history(i)}
        <label class="h" for="reason">Why is this declined?</label>
        <textarea id="reason" placeholder="Say what is wrong and what it should look like.">${esc(r.reason)}</textarea>
        ${showErr?`<p class="err">Write a reason so the agent knows what to fix.</p>`:""}
        <div class="h">Kind of problem (optional)</div>
        <div class="chips">${TAGS.map(t=>`<button class="chip" data-act="tag" data-tag="${t}" aria-pressed="${r.tags.includes(t)}">${t}</button>`).join("")}</div>
        <div class="h">Reference images (optional)</div>
        <div class="drop" id="drop" tabindex="0">Drop or paste images here, or <label for="file">choose files</label><input type="file" id="file" accept="image/*" multiple hidden></div>
        ${r.images.length?`<div class="thumbs">${r.images.map((im,n)=>`<div class="thumb"><img src="${im.dataUrl}" alt="${esc(im.name)}"><button data-act="rmImg" data-n="${n}" aria-label="Remove ${esc(im.name)}">×</button></div>`).join("")}</div>`:""}
        <div class="row">
          <button class="ghost" data-act="exPrev" ${exIdx===0?"disabled":""}>Previous</button><span class="sp"></span>
          <button class="btn primary" data-act="exNext">${last?"Create report":"Next declined"}</button>
        </div>
      </div>
    </div>`;
}
function promptText(){
  const d=declined(),open=ITEMS.filter(i=>!statusOf(i.key));
  let p=`You are continuing design run "${RUN.id}" for ${RUN.app} / ${RUN.feature}.\nThe owner reviewed the implementation by hand in review round ${RUN.round}. Fix only the declined states listed below.\n\nDeclined states (${d.length}):\n`;
  d.forEach((i,n)=>{const r=rec(i.key);
    p+=`\n${n+1}. ${i.screen} > ${i.name}  [${i.key}]\n   Owner's reason: ${r.reason.trim().replace(/\n+/g," ")}\n`;
    if(r.tags.length)p+=`   Kind of problem: ${r.tags.join(", ")}\n`;
    if(r.images.length)p+=`   Reference images: ${r.images.map((im,k)=>refName(i,im,k)).join(", ")}\n`;
    p+=`   QA agent's earlier verdict: ${qaLine(i)}${i.qa.notes.length?" ("+i.qa.notes.join(" ")+")":""}\n`;});
  p+=`\nFor each declined state:\n- Read the owner's reason and open the reference images in this report's references/ folder.\n- Compare the current implementation screenshot with the design reference, fix the code, re-capture the state, and re-run QA.\n- Stop after 3 fix rounds and mark the state blocked.\n\nRules:\n- The owner's reason outranks the QA agent's earlier verdict.\n- If a reason conflicts with the design reference, follow the reason and log it as an assumption.\n- Do not change approved states. If a fix must touch a shared component, re-capture every state that uses it and list them.\n`;
  if(open.length)p+=`- Do not change the ${open.length} state${open.length>1?"s":""} that were not reviewed: ${open.map(i=>i.key).join(", ")}.\n`;
  p+=`\nWhen finished, build a new review page that contains only the states above, showing the owner's previous reason beside each one.`;
  return p;
}
const extOf=u=>{const m=/^data:image\/([a-z0-9+.-]+)/i.exec(u);const e=m?m[1].toLowerCase():"png";return e==="jpeg"?"jpg":e==="svg+xml"?"svg":e;};
const refName=(i,im,k)=>`references/${i.key}-${k+1}.${extOf(im.dataUrl)}`;
function reportHTML(){
  const t=tally(),d=declined(),ok=ITEMS.filter(i=>statusOf(i.key)==="approved"),open=ITEMS.filter(i=>!statusOf(i.key));
  return `<div class="crumbs"><div><div class="over">${esc(RUN.app)} / ${esc(RUN.feature)}, review round ${RUN.round}</div><h1>Review report</h1></div>
      <button class="ghost" data-act="toReview">Back to review</button></div>
    <dl class="tiles four"><div><dt>States</dt><dd>${t.total}</dd></div><div class="ok"><dt>Approved</dt><dd>${t.ok}</dd></div><div class="no"><dt>Declined</dt><dd>${t.no}</dd></div><div><dt>Not decided</dt><dd>${t.open}</dd></div></dl>
    <p class="screens" style="margin:0">${screensLine(t)}</p>
    ${t.open?`<div class="note">${t.open} state${t.open>1?"s are":" is"} not decided. ${t.open>1?"They are":"It is"} listed as not reviewed and will not be sent for fixing.</div>`:""}
    <section class="sec"><h2>Declined states</h2>
      ${d.length?d.map(i=>{const r=rec(i.key);return `<div class="card dec"><h3>${esc(i.screen)}: ${esc(i.name)}</h3><div class="id">${esc(i.key)} · QA agent: ${esc(qaLine(i))}</div><p>${esc(r.reason.trim())}</p>
        ${r.tags.length?`<div class="chips">${r.tags.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`:""}
        ${r.images.length?`<div class="thumbs">${r.images.map(im=>`<div class="thumb"><img src="${im.dataUrl}" alt="${esc(im.name)}"></div>`).join("")}</div>`:""}
        <div><button class="link" data-act="editReason" data-key="${i.key}">Edit reason</button></div></div>`;}).join(""):`<p class="hint" style="margin:0">Nothing was declined.</p>`}
    </section>
    ${d.length?`<section class="sec"><h2>Prompt for the agent</h2><pre id="prompt">${esc(promptText())}</pre>
      <div class="row"><button class="ghost" data-act="copyPrompt">Copy prompt</button><span class="status">${esc(msg.copy||"")}</span></div></section>`:""}
    <section class="sec"><h2>Approved (${ok.length})</h2>${ok.length?`<ul class="plain">${ok.map(i=>`<li>${esc(i.screen)}: ${esc(i.name)}</li>`).join("")}</ul>`:`<p class="hint" style="margin:0">None yet.</p>`}</section>
    ${open.length?`<section class="sec"><h2>Not decided (${open.length})</h2><ul class="plain">${open.map(i=>`<li>${esc(i.screen)}: ${esc(i.name)}</li>`).join("")}</ul></section>`:""}
    <section class="sec"><h2>Hand it to the agent</h2>
      <div class="row"><button class="btn primary" data-act="download">Download report (.zip)</button><button class="ghost" data-act="copyReport">Copy report as text</button><span class="status">${esc(msg.dl||"")}</span></div>
      <p class="hint" style="margin:0">The zip holds report.md (stats, reasons and the prompt), decisions.json, and a references folder with your images.</p>
    </section>`;
}
function screensLine(t){return `${t.sTotal} screens: ${t.sOk} fully approved, ${t.sNo} with declined states, ${t.sOpen} not finished`;}
function sideHTML(){
  const t=tally(),pc=n=>(100*n/t.total).toFixed(2)+"%";
  let list="";RUN.screens.forEach(s=>{list+=`<h3>${esc(s.name)}</h3>`;
    s.states.forEach(st=>{const k=s.id+"--"+st.id,idx=ITEMS.findIndex(i=>i.key===k),v=statusOf(k);
      list+=`<button class="item ${view==="review"&&idx===cur?"cur":""}" data-act="go" data-i="${idx}"><span class="mark ${v==="approved"?"ok":v==="declined"?"no":""}" aria-hidden="true">${v==="approved"?"✓":v==="declined"?"✕":""}</span><span class="nm">${esc(st.name)}<span class="sr"> (${v||"not decided"})</span></span>${blocked(st)?`<span class="flag">QA flagged</span>`:""}</button>`;});});
  return `<section class="card"><h2>Progress</h2>
      <div class="bar" role="img" aria-label="${t.ok} approved, ${t.no} declined, ${t.open} not decided"><i class="ok" style="width:${pc(t.ok)}"></i><i class="no" style="width:${pc(t.no)}"></i></div>
      <dl class="tiles"><div><dt>States</dt><dd>${t.total}</dd></div><div class="ok"><dt>Approved</dt><dd>${t.ok}</dd></div><div class="no"><dt>Declined</dt><dd>${t.no}</dd></div><div><dt>Not decided</dt><dd>${t.open}</dd></div></dl>
      <p class="screens">${screensLine(t)}</p></section>
    <section class="card states"><h2>States</h2><nav class="list" aria-label="States">${list}</nav></section>
    <div class="gen"><button class="btn primary wide" data-act="generate" ${t.ok+t.no===0?"disabled":""}>Generate report</button></div>`;
}
function render(){
  document.getElementById("main").innerHTML=view==="review"?reviewHTML():view==="explain"?explainHTML():reportHTML();
  document.getElementById("side").innerHTML=sideHTML();
  document.querySelector(".app").dataset.view=view;
  document.getElementById("clear").textContent=clearArmed?"Click again to clear everything":"Clear all decisions";
  if(view==="explain")wireExplain();
}

/* ---------- explain step: text, images ---------- */
function curDeclined(){return declined()[exIdx];}
function addFiles(files){
  const i=curDeclined();if(!i)return;const r=rec(i.key);
  const imgs=[...files].filter(f=>f.type&&f.type.startsWith("image/"));let left=imgs.length;if(!left)return;
  imgs.forEach(f=>{const fr=new FileReader();fr.onload=()=>{r.images.push({name:f.name||"pasted image",dataUrl:fr.result});if(--left===0){persist();keepReason();render();}};fr.onerror=()=>{if(--left===0){persist();render();}};fr.readAsDataURL(f);});
}
function keepReason(){const ta=document.getElementById("reason"),i=curDeclined();if(ta&&i)rec(i.key).reason=ta.value;}
function wireExplain(){
  const ta=document.getElementById("reason"),drop=document.getElementById("drop"),file=document.getElementById("file");
  ta.addEventListener("input",()=>{keepReason();persist();if(showErr&&ta.value.trim().length>=3){showErr=false;const e=document.querySelector(".err");if(e)e.remove();}});
  file.addEventListener("change",()=>addFiles(file.files));
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));
  drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click();}});
}
document.addEventListener("paste",e=>{if(view!=="explain")return;const fs=[...(e.clipboardData?e.clipboardData.files:[])];if(fs.some(f=>f.type.startsWith("image/"))){e.preventDefault();addFiles(fs);}});

/* ---------- report files ---------- */
function reportMarkdown(){
  const t=tally(),d=declined(),ok=ITEMS.filter(i=>statusOf(i.key)==="approved"),open=ITEMS.filter(i=>!statusOf(i.key));
  let m=`# Design review report\n\n- Run: ${RUN.id}\n- App / feature: ${RUN.app} / ${RUN.feature}\n- Review round: ${RUN.round}\n- Device: ${RUN.device}\n- Build: ${RUN.build}\n- Generated: ${new Date().toISOString().slice(0,16).replace("T"," ")} UTC\n\n## Stats\n\n| | States |\n|---|---|\n| Approved | ${t.ok} |\n| Declined | ${t.no} |\n| Not decided | ${t.open} |\n| Total | ${t.total} |\n\n${screensLine(t)}.\n\n## Declined states\n\n`;
  if(!d.length)m+="None.\n\n";
  d.forEach((i,n)=>{const r=rec(i.key);m+=`### ${n+1}. ${i.screen}: ${i.name} (\`${i.key}\`)\n\n- QA agent's earlier verdict: ${qaLine(i)}${i.qa.notes.length?". "+i.qa.notes.join(" "):""}\n- Kind of problem: ${r.tags.length?r.tags.join(", "):"not tagged"}\n- Reference images: ${r.images.length?r.images.map((im,k)=>refName(i,im,k)).join(", "):"none"}\n\n**Owner's reason:**\n\n${r.reason.trim()}\n\n`;});
  m+=`## Approved states\n\n${ok.length?ok.map(i=>`- ${i.screen}: ${i.name} (\`${i.key}\`)`).join("\n"):"None."}\n\n## Not decided\n\n${open.length?open.map(i=>`- ${i.screen}: ${i.name} (\`${i.key}\`)`).join("\n"):"None."}\n`;
  if(d.length)m+=`\n## Prompt for the agent\n\n\`\`\`text\n${promptText()}\n\`\`\`\n`;
  return m;
}
function decisionsJSON(){
  return JSON.stringify({run:RUN.id,app:RUN.app,feature:RUN.feature,round:RUN.round,build:RUN.build,stats:tally(),
    states:ITEMS.map(i=>{const r=D[i.key]||{};return {key:i.key,screen:i.screen,state:i.name,decision:r.status||"undecided",qa:i.qa.verdict,
      reason:r.status==="declined"?(r.reason||"").trim():"",tags:r.status==="declined"?(r.tags||[]):[],
      references:r.status==="declined"?(r.images||[]).map((im,k)=>refName(i,im,k)):[]};})},null,2);
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){ // store-only zip, enough for a few text files and images
  const enc=new TextEncoder(),now=new Date();
  const time=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),date=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const parts=[],central=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.name),crc=crc32(f.data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,time,true);h.setUint16(12,date,true);
    h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);off+=30+name.length+f.data.length;});
  const cdSize=central.reduce((n,p)=>n+p.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/zip"});
}
function dataUrlBytes(u){const [head,body]=u.split(",");if(/;base64/i.test(head)){const b=atob(body),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}return new TextEncoder().encode(decodeURIComponent(body));}
function buildZip(){
  const enc=new TextEncoder(),files=[{name:"report.md",data:enc.encode(reportMarkdown())},{name:"decisions.json",data:enc.encode(decisionsJSON())}];
  declined().forEach(i=>rec(i.key).images.forEach((im,k)=>files.push({name:refName(i,im,k),data:dataUrlBytes(im.dataUrl)})));
  return zip(files);
}
let saver=null; // set when the page is hosted somewhere that brokers downloads
if(window.claude&&typeof window.claude.use==="function"){window.claude.use("downloads").then(d=>{saver=d;}).catch(()=>{});}
async function download(){
  const blob=buildZip(),filename=`design-review-${RUN.id}.zip`;
  if(saver){try{await saver.save({filename,data:blob});msg.dl="Saved.";}catch(e){msg.dl=e&&e.code==="declined"?"Download cancelled.":"Could not save here. Use Copy report as text instead.";}}
  else{try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg.dl="Download started. If nothing arrives, use Copy report as text.";}catch(e){msg.dl="Could not download here. Use Copy report as text instead.";}}
  render();
}
async function copy(text,slot){
  try{await navigator.clipboard.writeText(text);msg[slot]="Copied.";}
  catch(e){msg[slot]="Copy was blocked. Select the text and copy it by hand.";}
  render();
}

/* ---------- actions ---------- */
function decide(status){const i=ITEMS[cur];rec(i.key).status=status;persist();msg={};
  const nxt=ITEMS.findIndex((x,n)=>n>cur&&!statusOf(x.key));const any=nxt>-1?nxt:ITEMS.findIndex(x=>!statusOf(x.key));if(any>-1)cur=any;render();}
function step(n){cur=(cur+n+ITEMS.length)%ITEMS.length;render();}
const ACT={
  approve:()=>decide("approved"),decline:()=>decide("declined"),
  undo(){const i=ITEMS[cur];if(D[i.key])D[i.key].status=null;persist();render();},
  prev:()=>step(-1),next:()=>step(1),
  go(el){cur=+el.dataset.i;view="review";msg={};render();},
  toReview(){keepReason();persist();view="review";showErr=false;render();},
  generate(){const t=tally();msg={};if(t.ok+t.no===0)return;
    if(t.no){view="explain";exIdx=0;showErr=false;}else view="report";render();window.scrollTo(0,0);},
  tag(el){keepReason();const r=rec(curDeclined().key),t=el.dataset.tag;r.tags=r.tags.includes(t)?r.tags.filter(x=>x!==t):r.tags.concat(t);persist();render();},
  rmImg(el){keepReason();rec(curDeclined().key).images.splice(+el.dataset.n,1);persist();render();},
  exPrev(){keepReason();persist();showErr=false;if(exIdx>0)exIdx--;render();},
  exNext(){keepReason();persist();const list=declined();if(rec(list[exIdx].key).reason.trim().length<3){showErr=true;render();document.getElementById("reason").focus();return;}
    showErr=false;if(exIdx<list.length-1)exIdx++;else view="report";render();window.scrollTo(0,0);},
  editReason(el){exIdx=Math.max(0,declined().findIndex(i=>i.key===el.dataset.key));view="explain";showErr=false;render();},
  copyPrompt:()=>copy(promptText(),"copy"),copyReport:()=>copy(reportMarkdown(),"dl"),download,
  clear(){if(!clearArmed){clearArmed=true;render();setTimeout(()=>{clearArmed=false;render();},3500);return;}
    D={};persist();clearArmed=false;view="review";cur=0;msg={};render();}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act]&&!el.disabled)ACT[el.dataset.act](el);});
document.addEventListener("keydown",e=>{
  if(view!=="review"||e.metaKey||e.ctrlKey||e.altKey||/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();if(k==="a")decide("approved");else if(k==="d")decide("declined");else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);
});

document.getElementById("meta").textContent=`${RUN.app} / ${RUN.feature} · Review round ${RUN.round} · ${RUN.device} · build ${RUN.build}`;
if(RUN.width&&RUN.height){document.documentElement.style.setProperty("--ar",RUN.width+"/"+RUN.height);if(RUN.width>RUN.height)document.querySelector(".app").classList.add("wide");}
render();
})();
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</body>
</html>
